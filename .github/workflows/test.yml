name: Addon tests
on:
  pull_request:
  push:
    branches: [main, feat/forever-navigation]
permissions:
  contents: read
jobs:
  lua-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --target .work/pydeps lupa==2.8
      - run: python tests/run.py
      - run: python tests/package_test.py --source-only
